apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mir-ecosystem-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - dashboard.mir-ecosystem.com
    - api.mir-ecosystem.com
    secretName: mir-ecosystem-tls
  rules:
  - host: dashboard.mir-ecosystem.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-dashboard
            port:
              number: 80
  - host: api.mir-ecosystem.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
