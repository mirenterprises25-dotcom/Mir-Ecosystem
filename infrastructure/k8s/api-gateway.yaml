apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: mir-ecosystem
    component: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mir-ecosystem
      component: api-gateway
  template:
    metadata:
      labels:
        app: mir-ecosystem
        component: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/mir-enterprises/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mir-secrets
              key: jwt-secret
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mir-secrets
              key: database-url
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: mir-secrets
              key: rabbitmq-url
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: mir-ecosystem
    component: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  selector:
    app: mir-ecosystem
    component: api-gateway
