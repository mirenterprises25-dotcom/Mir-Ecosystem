apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  labels:
    app: mir-ecosystem
    component: agent-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mir-ecosystem
      component: agent-worker
  template:
    metadata:
      labels:
        app: mir-ecosystem
        component: agent-worker
    spec:
      containers:
      - name: agent-worker
        image: ghcr.io/mir-enterprises/agent-worker:latest
        imagePullPolicy: Always
        env:
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: mir-secrets
              key: litellm-api-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mir-secrets
              key: database-url
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: mir-secrets
              key: rabbitmq-url
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        # We assume celery consumes from all queues by default, 
        # or we could override the command args to scale specific queues
        command: ["celery", "-A", "ai_layer.core.messaging", "worker", "--loglevel=info"]
