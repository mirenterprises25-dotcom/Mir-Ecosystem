version: '3.8'

services:
  # ----------------------------------------------------
  # 1. POSTGRESQL (Relational Database)
  # ----------------------------------------------------
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: mir_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mir_ecosystem}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. REDIS (Cache & Celery Broker)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mir_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------
  # 3. RABBITMQ (Message Bus for Agent Communication)
  # ----------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mir_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ----------------------------------------------------
  # 4. QDRANT (Vector Database for Semantic Memory)
  # ----------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: mir_qdrant
    restart: always
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ----------------------------------------------------
  # 5. NGINX (Reverse Proxy / Ingress)
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: mir_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres
      - redis

  # ----------------------------------------------------
  # 6. OBSERVABILITY (Prometheus & Grafana)
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: mir_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    # Note: Will need a prometheus.yml config mounted in production

  grafana:
    image: grafana/grafana:10.2.2
    container_name: mir_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
