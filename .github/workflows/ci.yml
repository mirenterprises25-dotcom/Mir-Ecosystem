name: MIR-Ecosystem CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f api_gateway/requirements.txt ]; then pip install -r api_gateway/requirements.txt; fi
          if [ -f ai_layer/requirements.txt ]; then pip install -r ai_layer/requirements.txt; fi
      - name: Lint with Ruff
        run: ruff check api_gateway/ ai_layer/
      - name: Test Security
        run: |
          export PYTHONPATH="."
          if [ -f scripts/test_security.py ]; then python scripts/test_security.py; fi

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Frontend Dependencies
        run: |
          cd frontend/apps/main-dashboard
          if [ -f package.json ]; then npm ci; fi
      - name: Lint Next.js
        run: |
          cd frontend/apps/main-dashboard
          if [ -f package.json ]; then npm run lint; fi

  build-and-push:
    needs: [lint-and-test-python, lint-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push API Gateway
        uses: docker/build-push-action@v4
        with:
          context: ./api_gateway
          push: true
          tags: ghcr.io/${{ github.repository }}/api-gateway:latest
          
      - name: Build and push AI Layer
        uses: docker/build-push-action@v4
        with:
          context: ./ai_layer
          push: true
          tags: ghcr.io/${{ github.repository }}/agent-worker:latest
          
      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/apps/main-dashboard
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend-dashboard:latest
